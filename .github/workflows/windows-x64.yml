name: Build Windows x64 package

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:

permissions:
  contents: write

env:
  OPENCV_VERSION: "4.12.0"
  OPENCV_WINDOWS_SHA256: "b753b14d880b9bc8d89d6acd3b665c040baec0211078435432fcae117db707af"

jobs:
  build:
    name: MSVC x64 Debug and Release
    runs-on: windows-2022

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Download OpenCV 4.12.0 for the build
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "opencv-$env:OPENCV_VERSION-windows.exe"
          $extractRoot = Join-Path $env:RUNNER_TEMP "opencv-$env:OPENCV_VERSION"
          $url = "https://github.com/opencv/opencv/releases/download/$env:OPENCV_VERSION/opencv-$env:OPENCV_VERSION-windows.exe"

          curl.exe --fail --location --retry 3 $url --output $archive
          if ($LASTEXITCODE -ne 0) {
            throw "OpenCV download failed with exit code $LASTEXITCODE"
          }

          $actualHash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $env:OPENCV_WINDOWS_SHA256) {
            throw "OpenCV archive checksum mismatch: $actualHash"
          }

          New-Item -ItemType Directory -Force -Path $extractRoot | Out-Null
          & 7z x $archive "-o$extractRoot" -y | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw "OpenCV extraction failed with exit code $LASTEXITCODE"
          }

          $opencvConfig = Join-Path $extractRoot "opencv/build/x64/vc16/lib"
          $opencvBin = Join-Path $extractRoot "opencv/build/x64/vc16/bin"
          if (-not (Test-Path (Join-Path $opencvConfig "OpenCVConfig.cmake"))) {
            throw "OpenCVConfig.cmake was not found in $opencvConfig"
          }
          $requiredRuntimeDlls = @(
            (Join-Path $opencvBin "opencv_world4120d.dll"),
            (Join-Path $opencvBin "opencv_world4120.dll")
          )
          foreach ($runtimeDll in $requiredRuntimeDlls) {
            if (-not (Test-Path $runtimeDll)) {
              throw "Required OpenCV runtime DLL was not found: $runtimeDll"
            }
          }

          "OpenCV_DIR=$opencvConfig" | Out-File -FilePath $env:GITHUB_ENV -Append
          "OpenCV_BIN=$opencvBin" | Out-File -FilePath $env:GITHUB_ENV -Append
          $opencvBin | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Configure MSVC x64 shared-library build
        shell: pwsh
        run: |
          cmake -S . -B build-windows `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DBUILD_SHARED_LIBS=ON `
            -DBUILD_TESTING=ON `
            "-DOpenCV_DIR=$env:OpenCV_DIR"
          if ($LASTEXITCODE -ne 0) {
            throw "CMake configuration failed with exit code $LASTEXITCODE"
          }

      - name: Build and test Debug
        shell: pwsh
        run: |
          cmake --build build-windows --config Debug --parallel
          if ($LASTEXITCODE -ne 0) {
            throw "Debug build failed with exit code $LASTEXITCODE"
          }

          $env:PATH = "$env:OpenCV_BIN;$env:PATH"
          $detectorDll = Join-Path $PWD "build-windows/Debug/Stripe_Defect_Detectd.dll"
          if (-not (Test-Path $detectorDll)) {
            throw "Detector runtime DLL was not copied beside the Debug executable"
          }
          ctest --test-dir build-windows --build-config Debug --output-on-failure
          if ($LASTEXITCODE -ne 0) {
            throw "Debug tests failed with exit code $LASTEXITCODE"
          }

      - name: Build and test Release
        shell: pwsh
        run: |
          cmake --build build-windows --config Release --parallel
          if ($LASTEXITCODE -ne 0) {
            throw "Release build failed with exit code $LASTEXITCODE"
          }

          $env:PATH = "$env:OpenCV_BIN;$env:PATH"
          $detectorDll = Join-Path $PWD "build-windows/Release/Stripe_Defect_Detect.dll"
          if (-not (Test-Path $detectorDll)) {
            throw "Detector runtime DLL was not copied beside the Release executable"
          }
          ctest --test-dir build-windows --build-config Release --output-on-failure
          if ($LASTEXITCODE -ne 0) {
            throw "Release tests failed with exit code $LASTEXITCODE"
          }

      - name: Install and package detector artifacts
        id: package
        shell: pwsh
        run: |
          $debugInstall = Join-Path $env:RUNNER_TEMP "stripe-defect-debug"
          $releaseInstall = Join-Path $env:RUNNER_TEMP "stripe-defect-release"
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $version = $env:GITHUB_REF_NAME -replace '^v', ''
          } else {
            $version = "ci-$env:GITHUB_RUN_NUMBER"
          }
          $packageName = "Stripe_Defect_Detect-$version-windows-x64"
          $packageRoot = Join-Path $PWD "package/$packageName"

          cmake --install build-windows --config Debug --prefix $debugInstall
          if ($LASTEXITCODE -ne 0) {
            throw "Debug install failed with exit code $LASTEXITCODE"
          }
          cmake --install build-windows --config Release --prefix $releaseInstall
          if ($LASTEXITCODE -ne 0) {
            throw "Release install failed with exit code $LASTEXITCODE"
          }

          New-Item -ItemType Directory -Force -Path $packageRoot | Out-Null

          Copy-Item (Join-Path $releaseInstall "include/stripe_defect_detect.h") `
            (Join-Path $packageRoot "stripe_defect_detect.h")
          Copy-Item (Join-Path $debugInstall "bin/Stripe_Defect_Detectd.dll") `
            (Join-Path $packageRoot "Stripe_Defect_Detectd.dll")
          Copy-Item (Join-Path $releaseInstall "bin/Stripe_Defect_Detect.dll") `
            (Join-Path $packageRoot "Stripe_Defect_Detect.dll")
          Copy-Item (Join-Path $debugInstall "lib/Stripe_Defect_Detectd.lib") `
            (Join-Path $packageRoot "Stripe_Defect_Detectd.lib")
          Copy-Item (Join-Path $releaseInstall "lib/Stripe_Defect_Detect.lib") `
            (Join-Path $packageRoot "Stripe_Defect_Detect.lib")

          $unexpectedOpenCvFiles = Get-ChildItem $packageRoot -Recurse -File | `
            Where-Object { $_.Name -match '^opencv.*\.(dll|lib|pdb)$' }
          if ($unexpectedOpenCvFiles) {
            throw "OpenCV binaries must not be included in the detector package"
          }

          $archivePath = Join-Path $PWD "$packageName.zip"
          Compress-Archive -Path $packageRoot -DestinationPath $archivePath -Force
          "package_name=$packageName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "archive_path=$archivePath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Upload Windows x64 package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.package_name }}
          path: ${{ steps.package.outputs.archive_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Attach package to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_ARCHIVE: ${{ steps.package.outputs.archive_path }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $env:PACKAGE_ARCHIVE `
              --repo $env:GITHUB_REPOSITORY `
              --clobber
          } else {
            gh release create $tag $env:PACKAGE_ARCHIVE `
              --repo $env:GITHUB_REPOSITORY `
              --title $tag `
              --generate-notes
          }
          if ($LASTEXITCODE -ne 0) {
            throw "Publishing GitHub Release $tag failed with exit code $LASTEXITCODE"
          }
